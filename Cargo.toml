[package]
name = "cfgtool"
version = "0.1.0"
edition = "2021"
description = "A small configuration CLI with JSON, XML, dotenv, and authenticated encryption"
license = "MIT"
readme = "README.md"
keywords = ["configuration", "encryption", "cli", "dotenv"]
categories = ["command-line-utilities", "config", "cryptography"]

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
roxmltree = "0.21"
rpassword = "7"
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
